openapi: 3.1.1
info:
  title: E-commerce API
  version: 0.1.0
  description: Shared public REST contract exposed through the API gateway. Endpoints are added as their stories are implemented.
servers:
  - url: http://localhost:8080
    description: Local API gateway
tags:
  - name: Auth
    description: Registration and authentication
  - name: Product
    description: Product catalog and administration
  - name: Cart
    description: Saved customer cart
  - name: Checkout
    description: Checkout and order creation
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Register a customer
      description: >-
        US-001. Public registration always assigns Customer. Full name is trimmed;
        email is trimmed and lowercased before validation and storage. Password is
        not modified and requires at least eight characters, with no composition
        requirements. The password is stored only as a salted Argon2id hash.
        This operation does not issue an access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
            example:
              full_name: Amr Ahmed
              email: amr@example.com
              password: examplepassword
      responses:
        '201':
          description: Customer account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCustomerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: signInCustomer
      summary: Sign in and obtain an access token
      description: >-
        US-002 and US-003. Email is trimmed and lowercased; password is unchanged.
        Successful authentication returns an HS256 JWT valid for 30 minutes.
        Unknown email and incorrect password return the same invalid-credentials response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: amr@example.com
              password: examplepassword
      responses:
        '200':
          description: Authenticated; access token issued
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            Pragma:
              schema: {type: string, const: no-cache}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products:
    get:
      tags: [Product]
      operationId: browseProducts
      summary: Browse active products
      description: >-
        US-006. Lists active products without requiring authentication. Inactive
        products are excluded. Stock does not filter this listing, so active
        out-of-stock products remain visible. Prices are USD decimal strings.
      security: []
      responses:
        '200':
          description: Active products; data is an empty array when the catalog has no active products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseProductsResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/products:
    post:
      tags: [Product]
      operationId: createProduct
      summary: Create a product
      description: >-
        US-021. Requires Administrator role. Creates an active product using an
        existing category. Name, description, category ID, price and image URL
        are trimmed. USD price must be a positive decimal string. Stock and
        inventory initialization are outside this operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              name: Office Laptop
              description: Laptop for everyday office work
              category_id: 019a6000-0000-7000-8000-000000000001
              price_usd: '799.99'
      responses:
        '201':
          description: Active product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/checkout:
    post:
      tags: [Checkout]
      operationId: startCheckout
      summary: Start checkout and create an order awaiting payment
      description: >-
        US-014, US-015 and US-016. Requires Customer role. Uses the authenticated
        customer's entire saved cart, checks current product eligibility and USD
        prices, saves immutable price snapshots and reserves all items for up to
        15 minutes. Missing inventory records are treated as insufficient stock.
        Cart items remain saved. Payment is initiated in a later stage.
        Idempotency-Key identifies one order per Customer. Once an order is saved,
        repeating the same key returns its progress, completed checkout or recorded
        failure, including after a disconnect or service restart. Use a new key for
        a deliberate new checkout. Validation failures before order creation are
        not saved for replay. An absent body and an empty object are equivalent.
        Changes to the live cart do not change an existing order or its price snapshots.
        Transient failures are reconciled by a background worker. Stock cleanup
        applies only to orders that never became ready for payment; payment-aware
        expiry is handled in a later stage.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Customer-scoped key for one checkout intent; reuse it for retries.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
          example: checkout-019a6000-0000-7000-8000-000000000001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
            example: {}
      responses:
        '201':
          description: Order created with a confirmed stock reservation, or the same completed checkout replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '202':
          description: Checkout is processing or awaiting confirmed reservation cleanup. Retry the same request and key to retrieve its outcome.
          headers:
            Retry-After:
              description: Suggested delay in seconds before retrying the same key.
              schema: {type: integer, const: 5}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutProgressResponse'
              example:
                data:
                  order_id: 019a6000-0000-7000-8000-000000000002
                  status: PENDING
                errors: []
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN. Customer permission is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: EMPTY_CART or PRODUCT_UNAVAILABLE before order creation; or a saved INSUFFICIENT_STOCK, RESERVATION_UNAVAILABLE or CHECKOUT_FAILED outcome. Reusing a failed order's key does not create a new order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: SERVICE_UNAVAILABLE. Checkout outcome could not be retrieved within the deadline; retry using the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cart:
    get:
      tags: [Cart]
      operationId: viewSavedCart
      summary: View the authenticated customer's saved cart
      description: >-
        US-011. Requires Customer role. Returns only the authenticated customer's
        persisted product IDs and quantities, ordered by product ID. An absent
        or empty cart returns an empty items array. Product prices and totals
        are deferred.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved cart items, or an empty items array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewSavedCartResponse'
              example:
                data:
                  items: []
                errors: []
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN. Customer permission is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a product to the saved cart
      description: >-
        US-010. Requires Customer role. Saves a product and positive integer
        quantity in the authenticated customer's cart. Adding the same product
        increments the existing line. Product existence and active status checks
        are deferred; inventory is neither reserved nor deducted. Repeating a
        successful request increments again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            example:
              product_id: 019a6000-0000-7000-8000-000000000001
              quantity: 2
      responses:
        '200':
          description: Cart line saved with the resulting quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCartItemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN. Customer permission is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: QUANTITY_LIMIT_EXCEEDED. Resulting quantity exceeds 2147483647; the cart is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: UNAUTHORIZED. Authentication is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: FORBIDDEN. Administrator permission is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: VALIDATION_ERROR. Invalid JSON, unknown fields or invalid input. Field errors identify the invalid field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EmailAlreadyRegistered:
      description: EMAIL_ALREADY_REGISTERED. An account with this normalized email already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: INVALID_CREDENTIALS. Invalid email or password. Does not reveal which credential was incorrect.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: INTERNAL_ERROR. The operation failed without exposing internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CheckoutProgressResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [order_id, status]
          properties:
            order_id: {type: string, format: uuid}
            status:
              type: string
              enum: [PENDING, CLEANUP_PENDING]
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ApiError'
    CheckoutResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/CheckoutOrder'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ApiError'
    CheckoutOrder:
      type: object
      additionalProperties: false
      required: [order_id, status, currency, total_usd, reservation_id, reservation_expires_at, items]
      properties:
        order_id: {type: string, format: uuid}
        status: {type: string, const: AWAITING_PAYMENT}
        currency: {type: string, const: USD}
        total_usd:
          type: string
          description: Exact USD total calculated from the saved unit price snapshots and quantities.
          examples: ['1599.98']
        reservation_id: {type: string, format: uuid}
        reservation_expires_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/OrderItemSnapshot'
    OrderItemSnapshot:
      type: object
      additionalProperties: false
      required: [product_id, product_name, quantity, unit_price_usd]
      properties:
        product_id: {type: string, format: uuid}
        product_name: {type: string}
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        unit_price_usd:
          type: string
          description: Exact positive USD unit price captured at checkout; unaffected by subsequent catalog changes.
          examples: ['799.99']
    ViewSavedCartResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SavedCartItem'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ApiError'
    SavedCartItem:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: {type: string, format: uuid}
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    AddCartItemRequest:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
          description: A non-zero product UUID; existence and active status are not checked yet.
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    AddCartItemResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/CartItem'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ApiError'
    CartItem:
      type: object
      additionalProperties: false
      required: [cart_id, product_id, quantity]
      properties:
        cart_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, description, category_id, price_usd]
      properties:
        name:
          type: string
          minLength: 1
          description: Required; cannot be blank after trimming.
        description:
          type: string
          minLength: 1
          description: Required; cannot be blank after trimming.
        category_id:
          type: string
          format: uuid
          description: Must reference an existing category.
        price_usd:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Positive USD decimal amount; zero and negative values are rejected. Trimmed before validation.
          examples: ['799.99']
        image_url:
          type: string
          description: Optional product image URL.
    CreateProductResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/Product'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ApiError'
    Product:
      type: object
      additionalProperties: false
      required: [product_id, name, description, category_id, category_name, price_usd]
      properties:
        product_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        category_id: {type: string, format: uuid}
        category_name: {type: string}
        price_usd:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Exact USD decimal amount; represented as a string to preserve precision.
          examples: ['19.99']
        image_url:
          type: string
          description: Optional product image URL; omitted when not set.
    BrowseProductsResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ApiError'
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: A valid plain email address; trimmed and lowercased before lookup.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Required; verified as supplied, without trimming or modification.
    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Signed JWT containing sub, role, iss, aud, iat and exp.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 1800
          description: Token lifetime in seconds.
    SignInResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/AccessToken'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ApiError'
    RegisterCustomerRequest:
      type: object
      additionalProperties: false
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
          minLength: 1
          description: Required; cannot be blank after trimming surrounding whitespace.
        email:
          type: string
          description: A plain email address; trimmed, lowercased and validated. Display-name address forms are rejected.
          examples: [amr@example.com]
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: At least eight Unicode characters. No uppercase, lowercase, digit or symbol requirements. Never trimmed or modified.
    Customer:
      type: object
      additionalProperties: false
      required: [user_id, full_name, email, role]
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID v7 generated by the service.
        full_name: {type: string}
        email: {type: string, format: email}
        role:
          type: string
          enum: [Customer]
    RegisterCustomerResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/Customer'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      additionalProperties: false
      required: [error_code, message]
      properties:
        error_code: {type: string}
        message: {type: string}
        field:
          type: string
          description: Included when the error identifies a specific input field.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data: {type: 'null'}
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApiError'
