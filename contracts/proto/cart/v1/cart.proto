syntax = "proto3";
package cart.v1;
option go_package = "ecommerce.local/contracts/cart/v1;cartv1";

// Internal checkout API. Only trusted services may supply customer identity.
service CartService {
 rpc RemovePurchasedItems(RemovePurchasedItemsRequest) returns (RemovePurchasedItemsResponse);
 rpc GetCustomerCart(GetCustomerCartRequest) returns (GetCustomerCartResponse);
}
message GetCustomerCartRequest { string customer_id = 1; }
message CartItem {
 string product_id = 1;
 int32 quantity = 2;
}
message GetCustomerCartResponse { repeated CartItem items = 1; }

message RemovePurchasedItemsRequest {
 string order_id = 1;
 string customer_id = 2;
 repeated CartItem items = 3;
}
message RemovePurchasedItemsResponse {}
