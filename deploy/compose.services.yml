name: ecommerce-services

services:
  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    environment:
      HTTP_PORT: "8080"
      GRPC_PORT: "9090"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      POSTGRES_DSN: postgres://auth:auth_local_only@postgres:5432/auth_db?sslmode=disable
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    environment:
      HTTP_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HTTP_ADDRESS: http://auth-service:8080
      AUTH_GRPC_ADDRESS: auth-service:9090
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

networks:
  backend:
    name: ecommerce-backend
    external: true
