name: ecommerce-services

services:
  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    environment:
      HTTP_PORT: "8080"
      GRPC_PORT: "9090"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      POSTGRES_DSN: postgres://auth:auth_local_only@postgres:5432/auth_db?sslmode=disable
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  product-service:
    build:
      context: ..
      dockerfile: product-service/Dockerfile
    environment:
      HTTP_PORT: "8082"
      GRPC_PORT: "9091"
      POSTGRES_DSN: postgres://product:product_local_only@postgres:5432/product_db?sslmode=disable
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  cart-service:
    build:
      context: ..
      dockerfile: cart-service/Dockerfile
    environment:
      HTTP_PORT: "8083"
      GRPC_PORT: "9092"
      POSTGRES_DSN: postgres://cart:cart_local_only@postgres:5432/cart_db?sslmode=disable
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  inventory-service:
    build:
      context: ..
      dockerfile: inventory-service/Dockerfile
    environment:
      HTTP_PORT: "8084"
      GRPC_PORT: "9093"
      POSTGRES_DSN: postgres://inventory:inventory_local_only@postgres:5432/inventory_db?sslmode=disable
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    environment:
      HTTP_PORT: "8086"
      GRPC_PORT: "9095"
      POSTGRES_DSN: postgres://payment:payment_local_only@postgres:5432/payment_db?sslmode=disable
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY to your Stripe test secret key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET to your Stripe webhook signing secret}
      RABBITMQ_URL: amqp://ecommerce:rabbitmq_local_only@rabbitmq:5672/
      STRIPE_TIMEOUT_SECONDS: "5"
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-http://localhost:3000/checkout/success}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-http://localhost:3000/cart}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8086/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    environment:
      HTTP_PORT: "8085"
      GRPC_PORT: "9094"
      POSTGRES_DSN: postgres://order:order_local_only@postgres:5432/order_db?sslmode=disable
      CART_GRPC_ADDRESS: cart-service:9092
      PRODUCT_GRPC_ADDRESS: product-service:9091
      INVENTORY_GRPC_ADDRESS: inventory-service:9093
      PAYMENT_GRPC_ADDRESS: payment-service:9095
      RABBITMQ_URL: amqp://ecommerce:rabbitmq_local_only@rabbitmq:5672/
      PAYMENT_TIMEOUT_SECONDS: "10"
      RPC_TIMEOUT_SECONDS: "5"
      CHECKOUT_TIMEOUT_SECONDS: "20"
      RECOVERY_INTERVAL_SECONDS: "5"
      RECOVERY_BATCH_SIZE: "10"
    depends_on:
      cart-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    environment:
      HTTP_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_HTTP_ADDRESS: http://auth-service:8080
      PRODUCT_HTTP_ADDRESS: http://product-service:8082
      CART_HTTP_ADDRESS: http://cart-service:8083
      INVENTORY_HTTP_ADDRESS: http://inventory-service:8084
      ORDER_HTTP_ADDRESS: http://order-service:8085
      PAYMENT_HTTP_ADDRESS: http://payment-service:8086
      AUTH_GRPC_ADDRESS: auth-service:9090
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

networks:
  backend:
    name: ecommerce-backend
    external: true
