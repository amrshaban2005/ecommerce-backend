name: ecommerce-infra

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      # Local development credentials, shared with compose.services.yml.
      POSTGRES_PASSWORD: auth_local_only
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

networks:
  backend:
    name: ecommerce-backend
    driver: bridge

volumes:
  auth-postgres-data:
