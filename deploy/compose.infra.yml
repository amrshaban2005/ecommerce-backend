name: ecommerce-infra

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      # Local development bootstrap administrator; separate from service users.
      POSTGRES_PASSWORD: postgres_local_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/databases.sql:/docker-entrypoint-initdb.d/databases.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

networks:
  backend:
    name: ecommerce-backend
    driver: bridge

volumes:
  postgres-data:
